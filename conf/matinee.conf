# matinee: httpgrl (nginx-style) configuration plus the matinee block.
error_log stdout info;
worker_shutdown_timeout 5s;

events {
    worker_connections 1024;
    connections_per_client 16;
}

matinee {
    ingest_listen 1935;            # OBS: rtmp://<host>/live  with stream key below
    ingest_key    "change-me";
    # Proxy mode: uncomment to re-encode this ingest and publish it to a cloud matinee.
    # proxy_pass  rtmp://cloud.example/live/change-me;
    # proxy_ffmpeg /usr/bin/ffmpeg;
    # proxy_args -c:v libx264 -preset veryfast -tune zerolatency -bf 0
    #            -force_key_frames "expr:gte(t,n_forced*1)" -c:a aac -b:a 128k -ar 48000;
    password      "popcorn";       # viewers' shared password
    mode          live;            # live | sync
    delay         1s;              # target delay behind live
    max_delay     5s;
    congestion    1500ms;
    max_viewers   50;

    # Re-encode for viewers whose link can't carry the stream (needs ffmpeg; costs CPU while anyone's on it).
    adapt               off;
    # adapt_transcoders 1;
    # adapt_drop        5%;
    # adapt_min_bitrate 200k;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log stdout;

    # Password guessing: the WebSocket hello is the login.
    limit_req_zone $remote_net zone=ws:1m rate=30r/m;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        root ../web;               # the static client (can also be hosted anywhere else)
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /ws {
            limit_req zone=ws burst=10 nodelay;
            matinee_ws;
        }
    }
}
