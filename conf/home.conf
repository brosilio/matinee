# matinee, home side: OBS publishes here, and the GPU makes re-encodes on demand. Dials out to the cloud instance
# (conf/cloud.conf) through httpgrl's reverse tunnel, so nothing here needs to be reachable from the internet.
error_log stdout info;
worker_shutdown_timeout 5s;

events {
    worker_connections 256;
}

matinee {
    ingest_listen 1935;            # OBS: rtmp://<this box>/live, key below
    ingest_key    "change-me";
    uplink_key    "change-me-too"; # the cloud's uplink_pull must present this

    # Re-encodes the cloud asks for: on the GPU.
    adapt_encoder      vaapi;
    adapt_vaapi_device /dev/dri/renderD128;

    # Optional: viewers on the home network can watch here directly.
    password      "popcorn";
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log stdout;

    tunnel home {
        connect stream.example.com:8443;
        certificate     /etc/matinee/home.crt;    # CN or DNS SAN "home", issued by the cloud's tunnel CA
        certificate_key /etc/matinee/home.key;
    }

    # What the cloud reaches through the tunnel.
    server {
        listen tunnel:home;
        location = /.home-uplink { matinee_uplink; }
    }

    # Optional: LAN viewers.
    server {
        listen 8080;
        root /srv/matinee/web;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        location = /ws { matinee_ws; }
    }
}
