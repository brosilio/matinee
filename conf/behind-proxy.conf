# matinee behind an existing httpgrl/nginx doing TLS (e.g. https://example.com/matinee/), RTMP ingest on 1935.
error_log stdout info;
worker_shutdown_timeout 5s;

events {
    worker_connections 1024;
    connections_per_client 0;      # every viewer arrives through the local proxy, from 127.0.0.1
}

matinee {
    ingest_listen 1935;            # OBS: rtmp://example.com/live
    ingest_key    "change-me";
    password      "popcorn";
    mode          live;
    delay         1s;
    max_delay     5s;
    congestion    1500ms;
    max_viewers   50;
    adapt         off;             # 1 CPU, 1 GB: no re-encoding here

    hls           on;              # https://example.com/matinee/hls/<token>/index.m3u8
    hls_token     vrc-movie-night-change-me;
    hls_start     3s;
}

http {
    include /opt/matinee/mime.types;
    default_type application/octet-stream;
    access_log stdout;

    server {
        listen 127.0.0.1:18080;
        root /opt/matinee/web;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        location = /ws { matinee_ws; }
        location /hls/ { matinee_hls; }
    }
}

# In the front server's TLS server block:
