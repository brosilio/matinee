# matinee, cloud side: serves the viewers and relays bytes. No encoding happens here (1 CPU, 1 GB is plenty).
# The stream comes from the home instance (conf/home.conf) through httpgrl's reverse tunnel: home dials in, so it
# needs no open ports. See README "Two boxes: home and cloud".
error_log stdout info;
worker_shutdown_timeout 5s;

events {
    worker_connections 1024;
    connections_per_client 16;
}

matinee {
    # Pull the stream (and re-encodes) from home, through the tunnel location below. The key must match home's
    # uplink_key.
    uplink_pull   ws://127.0.0.1:8080/.home-uplink "change-me-too";
    password      "popcorn";
    mode          live;
    delay         1s;
    max_delay     5s;
    max_viewers   50;

    # Viewers who can't keep up get a re-encode, made by the home box's GPU. Home's upload is the limit:
    adapt         on;
    adapt_transcoders 1;           # source + one "terrible" stream
    adapt_budget  18m;             # leave some of home's ~20 Mbit/s upload spare

    # VRChat (and other HLS players): https://stream.example.com/hls/<token>/index.m3u8
    # hls       on;
    # hls_token vrc-movie-night-change-me;
    # hls_start 3s;                # web viewers match HLS ones with "delay 3500ms"
    # hls_low   600k;              # made by home's GPU while HLS viewers are around
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log stdout;

    upstream home { tunnel; }      # peers are home boxes that have dialed in

    limit_req_zone $remote_net zone=ws:1m rate=30r/m;

    # The tunnel's front door: home connects here with its client certificate (CN or DNS SAN "home").
    server {
        listen 8443 ssl;
        server_name stream.example.com;
        ssl_certificate      /etc/matinee/cloud.crt;
        ssl_certificate_key  /etc/matinee/cloud.key;
        ssl_verify_client    on;
        ssl_client_certificate /etc/matinee/tunnel-ca.pem;
        location = /.well-known/httpgrl-tunnel { tunnel_accept home; }
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        root /srv/matinee/web;
        index index.html;

        location / { try_files $uri $uri/ =404; }
        location = /ws {
            limit_req zone=ws burst=10 nodelay;
            matinee_ws;
        }
        # location /hls/ { matinee_hls; }
        # Only matinee itself (uplink_pull above) may use the tunnel.
        location = /.home-uplink {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://home;
            proxy_read_timeout 30s;
        }
    }
}
